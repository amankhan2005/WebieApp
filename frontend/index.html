    <!-- ══════════════════════════════════════════════════════
         GOOGLE ANALYTICS — GLOBAL SPA SETUP (GA4: G-6RQW6Q6S95)
         Tracks all pages automatically including React Router
         navigation via the 'page_view' event fired by the
         useGAPageTracking hook in App.jsx.
    ══════════════════════════════════════════════════════ -->

    <!-- Step 1: Load the GA4 library -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6RQW6Q6S95"></script>

    <!-- Step 2: Initialize and configure GA4 with SPA page tracking -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());

      // send_page_view: false — initial pageview is suppressed here.
      // React Router fires page_view on every navigation via
      // the useGAPageTracking hook in App.jsx, which handles
      // both the first load and all subsequent client-side navigations.
      gtag('config', 'G-6RQW6Q6S95', {
        send_page_view: false
      });
    </script>

    <!-- ⚡ NO-FLICKER theme init — runs before React hydrates -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('webie-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.style.backgroundColor = '#111823';
          }
        } catch(e) {}
      })();
    </script>
